name: S11 W6-010 Live Gemini Failure Regression Closure

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/run_step11_w6_010.py"
      - "scripts/run_step11_w6_010_live.py"
      - "scripts/verify/verify_step11_w6_010_evidence.py"
      - ".github/workflows/s11-wave6-010-closure.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  UV_VERSION: "0.12.21"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  w6-010:
    name: W6 live provider and closure qualification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - name: Install FFmpeg qualification toolchain
        shell: pwsh
        run: |
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
            $ok = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install ffmpeg -y --no-progress
              if ($LASTEXITCODE -eq 0) {
                $ok = $true
                break
              }
              Start-Sleep -Seconds 10
            }
            if (-not $ok) {
              throw "FFmpeg qualification toolchain installation failed after retries"
            }
          }
          ffmpeg -version
      - run: uv lock --check
      - run: uv sync --frozen --group quality --group test --group package
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run python scripts/verify/verify_ui_reference_manifest.py --root .
      - run: uv run pytest -q tests/unit/test_step11_w6_010_closure.py
      - run: uv run pytest -q
      - name: Generate owned W6-010 fixture
        run: >
          uv run python scripts/generate_step10_fixture.py
          --output artifacts/step11/w6-010/input-video.mp4
      - name: Run deterministic W6-010 render closure
        run: >
          uv run python scripts/run_step11_w6_010.py
          --video artifacts/step11/w6-010/input-video.mp4
          --evidence artifacts/step11/w6-010/evidence
      - name: Run optional live Gemini secure-store qualification
        env:
          ANG_W6_LIVE_VALUE: ${{ secrets.ANG_GEMINI_LIVE_KEY }}
        run: >
          uv run python scripts/run_step11_w6_010_live.py
          --evidence artifacts/step11/w6-010/evidence
      - name: Verify W6-010 closure evidence
        run: >
          uv run python scripts/verify/verify_step11_w6_010_evidence.py
          --evidence artifacts/step11/w6-010/evidence
      - uses: actions/upload-artifact@v4
        with:
          name: ANG-S11-W6-010-Closure
          path: artifacts/step11/w6-010/evidence/**
          if-no-files-found: error
          retention-days: 14
