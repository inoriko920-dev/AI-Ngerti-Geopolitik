name: TEMP S11 W1 Format Helper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/s11-w1-format-helper.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      - run: uv sync --frozen --group quality --group test --group package
      - run: uv run ruff format .
      - run: uv run ruff check . --fix
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Commit exact Ruff output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts .github/workflows/s11-wave1-foundation.yml
          git commit -m "style: apply Ruff formatting for STEP 11 W1"
          git push origin HEAD:main
