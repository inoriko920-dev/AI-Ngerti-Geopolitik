name: SOL INT01B B2 Python-only Subprocess Safety Fixture

on:
  push:
    branches: [feature/sol-int01b-b2-synthetic-process-harness]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: "offscreen"

jobs:
  synthetic-subprocess:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --group quality --group test
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run --frozen python scripts/verify/verify_ui_reference_manifest.py --root .
      - run: uv run pytest tests/unit/test_sol_int01b_b2_synthetic_subprocess.py -q
      - run: uv run pytest -q
      - name: Verify no production FFmpeg wiring
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          code = Path("src/ai_ngerti_geopolitik/infrastructure/synthetic_process_qualification.py").read_text(encoding="utf-8")
          assert "sys.executable" in code
          assert "SyntheticFixture" in code
          for forbidden in ("ffmpeg_slice", "FfmpegProcessRunner", "ExportJobService", "Popen([ffmpeg", "btn_export_render"):
              assert forbidden not in code, forbidden
          print("PASS B2 test harness uses only controlled Python; production FFmpeg/UI untouched")
          '@ | python
