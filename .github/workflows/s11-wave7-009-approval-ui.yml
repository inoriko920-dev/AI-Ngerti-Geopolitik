name: S11 W7-009 Approval Apply UI Diff

on:
  push:
    branches: [main]
    paths:
      - "src/ai_ngerti_geopolitik/application/ai_approval.py"
      - "src/ai_ngerti_geopolitik/application/ai_jobs.py"
      - "src/ai_ngerti_geopolitik/application/ai_l2_verifier.py"
      - "src/ai_ngerti_geopolitik/presentation/w6_ai_workspace.py"
      - "tests/unit/test_step11_w7_009_l2_approval.py"
      - "tests/qt/test_step11_w7_009_ui_diff.py"
      - "scripts/run_step11_w7_009.py"
      - "scripts/verify/verify_step11_w7_009_evidence.py"
      - ".github/workflows/s11-wave7-009-approval-ui.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  UV_VERSION: "0.12.21"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  w7-009:
    name: L2 approval atomic apply undo redo and UI diff
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --group quality --group test --group package
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run --frozen python scripts/verify/verify_ui_reference_manifest.py --root .
      - name: Run W7-009 targeted approval and UI tests
        run: >
          uv run pytest -q
          tests/unit/test_step11_w7_009_l2_approval.py
          tests/qt/test_step11_w7_009_ui_diff.py
      - run: uv run pytest -q
      - name: Run W7-009 deterministic evidence
        run: uv run python scripts/run_step11_w7_009.py
      - name: Verify W7-009 evidence
        run: uv run python scripts/verify/verify_step11_w7_009_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: ANG-S11-W7-009-Approval-UI-Diff
          path: artifacts/step11/w7-009/evidence/**
          if-no-files-found: error
          retention-days: 14
