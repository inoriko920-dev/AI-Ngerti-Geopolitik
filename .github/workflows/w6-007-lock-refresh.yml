name: W6-007 lock refresh

on:
  push:
    branches:
      - work/s11-w6-007
    paths:
      - "pyproject.toml"
      - ".github/workflows/w6-007-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/s11-w6-007
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      - name: Refresh uv.lock
        run: uv lock
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: lock google-genai runtime"
          git push origin HEAD:work/s11-w6-007
