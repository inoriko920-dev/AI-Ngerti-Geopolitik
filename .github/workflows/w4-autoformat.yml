name: Temporary W4 Autoformat

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/w4-autoformat.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --frozen --group quality
      - name: Format W4 files
        run: uv run ruff format scripts/run_step11_w4.py scripts/verify/verify_step11_w4_evidence.py src/ai_ngerti_geopolitik/application/creative.py src/ai_ngerti_geopolitik/domain/properties.py src/ai_ngerti_geopolitik/infrastructure/ffmpeg_creative.py src/ai_ngerti_geopolitik/infrastructure/ffmpeg_slice.py src/ai_ngerti_geopolitik/infrastructure/persistence.py src/ai_ngerti_geopolitik/presentation/creative_inspector.py tests/qt/test_step11_w4_creative_inspector.py tests/unit/test_step11_w4_creative.py
      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts src tests
          if (git diff --cached --quiet) {
            Write-Host "No formatting changes"
            exit 0
          }
          git commit -m "style: format W4 implementation"
          git push
