name: Temporary W8-008 Scoped Ruff Formatting
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-w8-008-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.10
      - name: Format scoped W8-008 Python only
        run: |
          ruff check --fix src/ai_ngerti_geopolitik/application/project_jobs.py src/ai_ngerti_geopolitik/application/project_session.py src/ai_ngerti_geopolitik/application/relink_scan.py tests/unit/test_step11_w8_008_stale_jobs.py scripts/run_step11_w8_008.py scripts/verify/verify_step11_w8_008_evidence.py || true
          ruff format src/ai_ngerti_geopolitik/application/project_jobs.py src/ai_ngerti_geopolitik/application/project_session.py src/ai_ngerti_geopolitik/application/relink_scan.py tests/unit/test_step11_w8_008_stale_jobs.py scripts/run_step11_w8_008.py scripts/verify/verify_step11_w8_008_evidence.py
          ruff format --check .
      - name: Commit and delete temporary formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_ngerti_geopolitik/application/project_jobs.py src/ai_ngerti_geopolitik/application/project_session.py src/ai_ngerti_geopolitik/application/relink_scan.py tests/unit/test_step11_w8_008_stale_jobs.py scripts/run_step11_w8_008.py scripts/verify/verify_step11_w8_008_evidence.py
          git rm .github/workflows/temporary-w8-008-format.yml
          git commit -m "style: format W8-008 and remove temporary action"
          git push origin HEAD:main
