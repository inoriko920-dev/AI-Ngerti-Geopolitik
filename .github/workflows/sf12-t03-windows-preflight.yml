name: SF12 T03 Preflight and Capability Negotiation

on:
  push:
    branches: [feature/sf12-t03-export-preflight]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: "offscreen"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --frozen --group quality --group test
      - run: uv run ruff format --diff src/ai_ngerti_geopolitik/application/export_preflight.py src/ai_ngerti_geopolitik/infrastructure/export_output_inspector.py tests/unit/test_sf12_t03_export_preflight.py
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run --frozen python scripts/verify/verify_ui_reference_manifest.py --root .
      - run: uv run pytest tests/unit/test_sf12_t03_export_preflight.py -q
      - run: uv run pytest -q
