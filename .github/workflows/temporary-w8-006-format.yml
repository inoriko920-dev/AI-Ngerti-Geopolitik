name: Temporary W8-006 Formatting
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-w8-006-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install exact pinned Ruff
        run: python -m pip install ruff==0.16.10
      - name: Auto-fix and format W8-006 owned Python
        run: |
          ruff check --fix src/ai_ngerti_geopolitik/application/recovery.py src/ai_ngerti_geopolitik/infrastructure/crash_marker.py src/ai_ngerti_geopolitik/presentation/recovery.py src/ai_ngerti_geopolitik/application/project_session.py src/ai_ngerti_geopolitik/application/ui_intents.py tests/unit/test_step11_w8_006_recovery.py tests/qt/test_step11_w8_006_recovery.py scripts/run_step11_w8_006.py scripts/verify/verify_step11_w8_006_evidence.py || true
          ruff format src/ai_ngerti_geopolitik/application/recovery.py src/ai_ngerti_geopolitik/infrastructure/crash_marker.py src/ai_ngerti_geopolitik/presentation/recovery.py src/ai_ngerti_geopolitik/application/project_session.py src/ai_ngerti_geopolitik/application/ui_intents.py tests/unit/test_step11_w8_006_recovery.py tests/qt/test_step11_w8_006_recovery.py scripts/run_step11_w8_006.py scripts/verify/verify_step11_w8_006_evidence.py
          ruff format --check .
      - name: Commit formatted W8-006 and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_ngerti_geopolitik/application/recovery.py src/ai_ngerti_geopolitik/infrastructure/crash_marker.py src/ai_ngerti_geopolitik/presentation/recovery.py src/ai_ngerti_geopolitik/application/project_session.py src/ai_ngerti_geopolitik/application/ui_intents.py tests/unit/test_step11_w8_006_recovery.py tests/qt/test_step11_w8_006_recovery.py scripts/run_step11_w8_006.py scripts/verify/verify_step11_w8_006_evidence.py
          git rm .github/workflows/temporary-w8-006-format.yml
          git commit -m "style: format W8-006 and remove temporary action"
          git push origin HEAD:main
