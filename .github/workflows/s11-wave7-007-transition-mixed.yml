name: S11 W7-007 Transition Mixed Qualification

on:
  push:
    branches: [main]
    paths:
      - "src/ai_ngerti_geopolitik/application/ai_l2_verifier.py"
      - "src/ai_ngerti_geopolitik/infrastructure/ffmpeg_creative.py"
      - "src/ai_ngerti_geopolitik/infrastructure/ffmpeg_properties.py"
      - "src/ai_ngerti_geopolitik/infrastructure/ffmpeg_slice.py"
      - "tests/unit/test_step11_w7_007_transition_mixed.py"
      - "scripts/run_step11_w7_007.py"
      - "scripts/verify/verify_step11_w7_007_evidence.py"
      - ".github/workflows/s11-wave7-007-transition-mixed.yml"
      - "scripts/generate_step10_fixture.py"
      - "docs/evidence/features/S11_W7_007_TRANSITION_MIXED_QUALIFICATION.md"
      - "docs/project/W7_AI_AUTO_EDIT_L2_CONTRACT.md"
      - "docs/PROJECT_STATUS.md"
      - "docs/SOURCE_OF_TRUTH_INDEX.md"
      - "HANDOFF.md"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  UV_VERSION: "0.12.21"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  w7-007:
    name: L2 transition and mixed-plan real-media qualification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - name: Install FFmpeg qualification toolchain
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - run: uv lock --check
      - run: uv sync --frozen --group quality --group test --group package
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run --frozen python scripts/verify/verify_ui_reference_manifest.py --root .
      - run: uv run pytest -q tests/unit/test_step11_w7_007_transition_mixed.py
      - run: uv run pytest -q
      - name: Generate owned W7-007 fixture
        run: >
          uv run python scripts/generate_step10_fixture.py
          --output artifacts/step11/w7-007/input-video.mp4
      - name: Run W7-007 transition and mixed-plan evidence
        run: >
          uv run python scripts/run_step11_w7_007.py
          --video artifacts/step11/w7-007/input-video.mp4
          --evidence artifacts/step11/w7-007/evidence
      - name: Verify W7-007 evidence
        run: >
          uv run python scripts/verify/verify_step11_w7_007_evidence.py
          --evidence artifacts/step11/w7-007/evidence
      - uses: actions/upload-artifact@v4
        with:
          name: ANG-S11-W7-007-L2-Transition-Mixed
          path: artifacts/step11/w7-007/evidence/**
          if-no-files-found: error
          retention-days: 14
