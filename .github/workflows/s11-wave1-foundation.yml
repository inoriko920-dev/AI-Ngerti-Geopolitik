name: S11 W1 Project Media Persistence

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/run_step11_w1.py"
      - "scripts/verify/verify_step11_w1_evidence.py"
      - "scripts/generate_step10_fixture.py"
      - ".github/workflows/s11-wave1-foundation.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  UV_VERSION: "0.12.21"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  w1-foundation:
    name: W1 project media persistence
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install FFmpeg probe toolchain
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - run: uv lock --check
      - run: uv sync --frozen --group quality --group test --group package
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run --frozen python scripts/verify/verify_ui_reference_manifest.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run pytest -q
      - name: Generate real video fixture
        run: >
          uv run python scripts/generate_step10_fixture.py
          --output artifacts/step11/w1/input-video.mp4
      - name: Generate real audio and image fixtures
        shell: pwsh
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=523:sample_rate=48000:duration=2" -c:a pcm_s16le artifacts/step11/w1/input-audio.wav
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x4A90E2:s=800x600" -frames:v 1 artifacts/step11/w1/input-image.png
      - name: Run W1 lifecycle/media/persistence evidence path
        run: >
          uv run python scripts/run_step11_w1.py
          --video artifacts/step11/w1/input-video.mp4
          --audio artifacts/step11/w1/input-audio.wav
          --image artifacts/step11/w1/input-image.png
          --evidence artifacts/step11/w1/evidence
      - name: Verify W1 evidence
        run: >
          uv run python scripts/verify/verify_step11_w1_evidence.py
          --evidence artifacts/step11/w1/evidence
      - uses: actions/upload-artifact@v4
        with:
          name: ANG-S11-W1-Project-Media-Persistence
          path: artifacts/step11/w1/evidence/**
          if-no-files-found: error
          retention-days: 14
