name: Temporary W4 Ruff Autofix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/w4-autofix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --frozen --group quality
      - name: Apply Ruff safe fixes
        run: uv run ruff check --fix scripts/run_step11_w4.py src/ai_ngerti_geopolitik/application/creative.py src/ai_ngerti_geopolitik/domain/__init__.py src/ai_ngerti_geopolitik/infrastructure/persistence.py tests/unit/test_step11_w4_creative.py
      - name: Reformat fixed files
        run: uv run ruff format scripts/run_step11_w4.py src/ai_ngerti_geopolitik/application/creative.py src/ai_ngerti_geopolitik/domain/__init__.py src/ai_ngerti_geopolitik/infrastructure/persistence.py tests/unit/test_step11_w4_creative.py
      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts src tests
          if (git diff --cached --quiet) {
            Write-Host "No lint fixes"
            exit 0
          }
          git commit -m "style: apply Ruff W4 import fixes"
          git push
