name: S11 W8-006 Crash Marker Recovery

on:
  push:
    branches: [main]
    paths:
      - "src/ai_ngerti_geopolitik/application/recovery.py"
      - "src/ai_ngerti_geopolitik/infrastructure/crash_marker.py"
      - "src/ai_ngerti_geopolitik/presentation/recovery.py"
      - "src/ai_ngerti_geopolitik/application/project_session.py"
      - "src/ai_ngerti_geopolitik/application/ui_intents.py"
      - "tests/unit/test_step11_w8_006_recovery.py"
      - "tests/qt/test_step11_w8_006_recovery.py"
      - "scripts/run_step11_w8_006.py"
      - "scripts/verify/verify_step11_w8_006_evidence.py"
      - ".github/workflows/s11-wave8-006-crash-recovery.yml"
      - "docs/evidence/features/S11_W8_006_CRASH_RECOVERY.md"
      - "docs/project/**"
      - "HANDOFF.md"
      - "docs/PROJECT_STATUS.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: "offscreen"

jobs:
  w8-006:
    runs-on: windows-latest
    name: Crash recovery startup decisions and source integrity
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --group quality --group test --group package
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run python scripts/verify/verify_ui_reference_manifest.py --root .
      - run: uv run pytest -q tests/unit/test_step11_w8_006_recovery.py tests/qt/test_step11_w8_006_recovery.py
      - run: uv run pytest -q
      - run: >
          uv run python scripts/run_step11_w8_006.py
          --evidence artifacts/step11/w8-006/evidence
      - run: uv run python scripts/verify/verify_step11_w8_006_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: ANG-S11-W8-006-Crash-Recovery
          path: artifacts/step11/w8-006/evidence/**
          retention-days: 14
          if-no-files-found: error
