name: Temporary W8-009 Pinned Ruff Formatter
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-w8-009-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.10
      - name: Auto-fix and format owned W8-009 Python
        run: |
          ruff check --fix src/ai_ngerti_geopolitik/application/diagnostics.py src/ai_ngerti_geopolitik/application/diagnostic_bundle.py src/ai_ngerti_geopolitik/infrastructure/diagnostic_bundle.py tests/unit/test_step11_w8_009_diagnostics.py scripts/run_step11_w8_009.py scripts/verify/verify_step11_w8_009_evidence.py || true
          ruff format src/ai_ngerti_geopolitik/application/diagnostics.py src/ai_ngerti_geopolitik/application/diagnostic_bundle.py src/ai_ngerti_geopolitik/infrastructure/diagnostic_bundle.py tests/unit/test_step11_w8_009_diagnostics.py scripts/run_step11_w8_009.py scripts/verify/verify_step11_w8_009_evidence.py
          ruff format --check .
      - name: Commit formatted owned code and delete temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_ngerti_geopolitik/application/diagnostics.py src/ai_ngerti_geopolitik/application/diagnostic_bundle.py src/ai_ngerti_geopolitik/infrastructure/diagnostic_bundle.py tests/unit/test_step11_w8_009_diagnostics.py scripts/run_step11_w8_009.py scripts/verify/verify_step11_w8_009_evidence.py
          git rm .github/workflows/temporary-w8-009-format.yml
          git commit -m "style: format W8-009 code and remove temporary formatter"
          git push origin HEAD:main
