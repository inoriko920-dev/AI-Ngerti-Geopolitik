name: SF12 T07 Subtitles Narration Sharpen Quality Real Media

on:
  push:
    branches: [feature/sf12-t07-style-subtitles-narration]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: "offscreen"

jobs:
  qualification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --frozen --group quality --group test
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run --frozen python scripts/verify/verify_ui_reference_manifest.py --root .
      - run: uv run pytest tests/unit/test_sf12_t07_style.py -q
      - run: uv run pytest -q
      - name: Install external qualification FFmpeg, no bundle
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Generate source-owned media
        run: uv run python scripts/generate_step10_fixture.py --output artifacts/sf12-t07/source_video.mp4
      - name: Render and inspect subtitle, sharpen, CRF/preset and narration variants
        run: uv run python scripts/qualification/sf12_t07_real_style.py --fixture artifacts/sf12-t07/source_video.mp4 --evidence artifacts/sf12-t07/evidence
      - name: Independent FFprobe final audio/video stream inspection
        shell: pwsh
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate,nb_frames -show_entries format=duration,format_name -of json artifacts/sf12-t07/evidence/style_5.mp4
          Get-FileHash artifacts/sf12-t07/evidence/style_5.mp4 -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: ANG-SF12-T07-Style-RealMedia
          path: artifacts/sf12-t07/evidence/**
          if-no-files-found: error
          retention-days: 14
