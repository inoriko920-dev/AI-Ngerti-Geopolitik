name: ANG Pilot A Real H264 Windows

on:
  push:
    branches: [fix/project-open-corrupt-json-fail-closed-20261008]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-a-real-h264:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: "offscreen"
      ANG_PILOT_A_FFMPEG: "1"
      ANG_PILOT_A_OUTPUT_DIR: "pilot-output"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --frozen --group quality --group test
      - name: Require real FFmpeg and FFprobe with libx264
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            throw "Pilot A FAIL: Native FFmpeg and FFprobe unavailable"
          }
          ffmpeg -hide_banner -encoders | Select-String "libx264"
          if ($LASTEXITCODE -ne 0) { throw "Pilot A FAIL: libx264 encoder unavailable" }
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Produce REAL synthetic MP4 and validate H264 frames
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          uv run pytest tests/unit/test_pilot_a_real_mp4.py tests/unit/test_pilot_a_120_unique_resources.py -q -ra
      - name: Upload real H264 sample and checksum
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ANG-Pilot-A-Real-H264-Windows
          path: pilot-output/
          if-no-files-found: error
          retention-days: 14
