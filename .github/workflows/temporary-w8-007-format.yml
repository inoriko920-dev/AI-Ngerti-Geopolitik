name: Temporary W8-007 Pinned Ruff Formatter
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-w8-007-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.10
      - name: Format W8-007 owned Python code and tests
        run: |
          ruff check --fix src/ai_ngerti_geopolitik/application/persistence_failure.py src/ai_ngerti_geopolitik/infrastructure/persistence.py tests/unit/test_step11_w8_007_atomic_persistence.py scripts/run_step11_w8_007.py scripts/verify/verify_step11_w8_007_evidence.py || true
          ruff format src/ai_ngerti_geopolitik/application/persistence_failure.py src/ai_ngerti_geopolitik/infrastructure/persistence.py tests/unit/test_step11_w8_007_atomic_persistence.py scripts/run_step11_w8_007.py scripts/verify/verify_step11_w8_007_evidence.py
          ruff format --check .
      - name: Commit changes and delete one-time formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_ngerti_geopolitik/application/persistence_failure.py src/ai_ngerti_geopolitik/infrastructure/persistence.py tests/unit/test_step11_w8_007_atomic_persistence.py scripts/run_step11_w8_007.py scripts/verify/verify_step11_w8_007_evidence.py
          git rm .github/workflows/temporary-w8-007-format.yml
          git commit -m "style: format W8-007 and remove temporary formatter"
          git push origin HEAD:main
