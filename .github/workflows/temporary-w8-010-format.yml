name: Temporary W8-010 Ruff Formatter
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-w8-010-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.10
      - name: Format W8-010 Python without changing earlier components
        run: |
          ruff check --fix src/ai_ngerti_geopolitik/bootstrap/main.py src/ai_ngerti_geopolitik/bootstrap/w8_controller.py src/ai_ngerti_geopolitik/presentation/main_window.py tests/qt/test_step11_w8_010_runtime_wiring.py scripts/run_step11_w8_010.py scripts/verify/verify_step11_w8_010_evidence.py || true
          ruff format src/ai_ngerti_geopolitik/bootstrap/main.py src/ai_ngerti_geopolitik/bootstrap/w8_controller.py src/ai_ngerti_geopolitik/presentation/main_window.py tests/qt/test_step11_w8_010_runtime_wiring.py scripts/run_step11_w8_010.py scripts/verify/verify_step11_w8_010_evidence.py
          ruff format --check .
      - name: Commit scoped formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_ngerti_geopolitik/bootstrap/main.py src/ai_ngerti_geopolitik/bootstrap/w8_controller.py src/ai_ngerti_geopolitik/presentation/main_window.py tests/qt/test_step11_w8_010_runtime_wiring.py scripts/run_step11_w8_010.py scripts/verify/verify_step11_w8_010_evidence.py
          git rm .github/workflows/temporary-w8-010-format.yml
          git commit -m "style: format W8-010 runtime UI and tests"
          git push origin HEAD:main
