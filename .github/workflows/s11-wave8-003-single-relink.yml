name: S11 W8-003 Single Asset Relink

on:
  push:
    branches: [main]
    paths:
      - "src/ai_ngerti_geopolitik/application/commands.py"
      - "src/ai_ngerti_geopolitik/application/relink.py"
      - "tests/unit/test_step11_w8_003_relink.py"
      - "scripts/run_step11_w8_003.py"
      - "scripts/verify/verify_step11_w8_003_evidence.py"
      - "scripts/generate_step10_fixture.py"
      - ".github/workflows/s11-wave8-003-single-relink.yml"
      - "docs/evidence/features/S11_W8_003_SINGLE_ASSET_RELINK.md"
      - "docs/project/W8_VALIDATION_RECOVERY_DIAGNOSTICS_CONTRACT.md"
      - "docs/project/PLAN.md"
      - "docs/project/TASKS.md"
      - "docs/PROJECT_STATUS.md"
      - "docs/SOURCE_OF_TRUTH_INDEX.md"
      - "HANDOFF.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  UV_VERSION: "0.12.21"

jobs:
  w8-003:
    name: Verified single asset relink and exact identity preservation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - name: Install FFmpeg qualification toolchain
        shell: pwsh
        run: |
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
            $ok = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install ffmpeg -y --no-progress
              if ($LASTEXITCODE -eq 0) {
                $ok = $true
                break
              }
              Start-Sleep -Seconds 10
            }
            if (-not $ok) {
              throw "FFmpeg qualification toolchain installation failed after retries"
            }
          }
          ffmpeg -version
      - run: uv lock --check
      - run: uv sync --frozen --group quality --group test --group package
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run python scripts/verify/verify_ui_reference_manifest.py --root .
      - run: uv run pytest -q tests/unit/test_step11_w8_003_relink.py
      - run: uv run pytest -q
      - name: Generate owned W8-003 fixture
        run: >
          uv run python scripts/generate_step10_fixture.py
          --output artifacts/step11/w8-003/input-video.mp4
      - name: Run W8-003 real relocation evidence
        run: >
          uv run python scripts/run_step11_w8_003.py
          --video artifacts/step11/w8-003/input-video.mp4
          --evidence artifacts/step11/w8-003/evidence
      - name: Verify W8-003 evidence
        run: uv run python scripts/verify/verify_step11_w8_003_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: ANG-S11-W8-003-Single-Asset-Relink
          path: artifacts/step11/w8-003/evidence/**
          if-no-files-found: error
          retention-days: 14
