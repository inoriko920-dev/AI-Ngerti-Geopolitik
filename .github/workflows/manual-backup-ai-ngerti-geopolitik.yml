name: Backup AI-Ngerti-Geopolitik

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/manual-backup-ai-ngerti-geopolitik.yml'

permissions:
  contents: read

jobs:
  backup:
    if: "github.event.head_commit.message == 'chore(backup): generate AI-Ngerti-Geopolitik backup'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: e176f194c0d8c713348df9ba2675aaf7b10b80de
      BACKUP_STAMP: 2026-10-08_00-45_WIB
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create verified repository backup payload
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/AI-Ngerti-Geopolitik-BACKUP-$BACKUP_STAMP"
          APP="$ROOT/APP_001_AI-Ngerti-Geopolitik"
          mkdir -p "$APP/GIT" "$APP/SOURCE" "$APP/DOCS" "$APP/RECOVERY" "$APP/BUILD"

          git clone --mirror "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/repo.git"
          git -C "$RUNNER_TEMP/repo.git" update-ref refs/heads/main "$TARGET_SHA"

          git -C "$RUNNER_TEMP/repo.git" show -s --format='%H%n%ci%n%s' "$TARGET_SHA" > "$APP/MAIN_COMMIT.txt"
          git -C "$RUNNER_TEMP/repo.git" for-each-ref --format='%(refname) %(objectname)' refs/heads refs/remotes > "$APP/BRANCHES.txt"
          git -C "$RUNNER_TEMP/repo.git" for-each-ref --format='%(refname) %(objectname)' refs/tags > "$APP/TAGS.txt"
          git -C "$RUNNER_TEMP/repo.git" log --all --date=iso-strict --pretty=format:'%H%x09%ad%x09%an%x09%s' > "$APP/COMMIT_HISTORY.txt"

          git -C "$RUNNER_TEMP/repo.git" bundle create "$APP/GIT/AI-Ngerti-Geopolitik-COMPLETE-GIT-HISTORY.bundle" --all
          git -C "$RUNNER_TEMP/repo.git" bundle verify "$APP/GIT/AI-Ngerti-Geopolitik-COMPLETE-GIT-HISTORY.bundle" > "$APP/GIT/BUNDLE_VERIFY.txt" 2>&1

          git -C "$RUNNER_TEMP/repo.git" archive --format=zip --output="$APP/SOURCE/AI-Ngerti-Geopolitik-SOURCE-main.zip" "$TARGET_SHA"

          mkdir -p "$RUNNER_TEMP/source_extract"
          unzip -q "$APP/SOURCE/AI-Ngerti-Geopolitik-SOURCE-main.zip" -d "$RUNNER_TEMP/source_extract"
          if [ -d "$RUNNER_TEMP/source_extract/docs" ]; then
            cp -a "$RUNNER_TEMP/source_extract/docs/." "$APP/DOCS/"
          fi
          for f in README.md HANDOFF.md AGENTS.md THIRD_PARTY_NOTICES.md pyproject.toml uv.lock; do
            if [ -f "$RUNNER_TEMP/source_extract/$f" ]; then
              cp "$RUNNER_TEMP/source_extract/$f" "$APP/DOCS/"
            fi
          done

          cat > "$APP/REPOSITORY_INFO.txt" <<EOT
          APP NAME: AI-Ngerti-Geopolitik
          ORIGINAL REPO: https://github.com/inoriko920-dev/AI-Ngerti-Geopolitik
          DEFAULT BRANCH: main
          BACKUP TARGET COMMIT: $TARGET_SHA
          BACKUP STAMP: $BACKUP_STAMP
          BACKUP SCOPE: THIS REPOSITORY ONLY
          EOT

          cat > "$APP/REQUIRED_SECRETS.txt" <<'EOT'
          SECRET_REQUIRED_BUT_NOT_BACKED_UP
          No secret values are stored in this backup.
          Re-enter any provider/API credentials required by the application after restore.
          EOT

          cat > "$APP/BUILD/BUILD_STATUS.txt" <<'EOT'
          BUILD_NOT_INCLUDED_IN_REPOSITORY_BACKUP_PAYLOAD
          Existing trusted GitHub Actions build artifacts, if still available, are handled separately by the backup integrator.
          EOT

          cat > "$APP/RECOVERY/PETUNJUK_PEMULIHAN.txt" <<'EOT'
          PEMULIHAN KE GITHUB BARU (WINDOWS 11)
          1. Ekstrak ZIP backup utama.
          2. Buka folder APP_001_AI-Ngerti-Geopolitik.
          3. Jalankan RECOVERY\VERIFY_BACKUP.ps1.
          4. Pastikan Git Bundle dinyatakan valid.
          5. Buat repository kosong baru di akun GitHub baru.
          6. Clone bundle:
             git clone GIT\AI-Ngerti-Geopolitik-COMPLETE-GIT-HISTORY.bundle AI-Ngerti-Geopolitik
          7. Masuk ke folder hasil clone.
          8. Atur remote baru:
             git remote remove origin
             git remote add origin https://github.com/AKUN_BARU/AI-Ngerti-Geopolitik.git
          9. Push branch dan tag:
             git push -u origin --all
             git push origin --tags
          10. Pasang kembali secret/credential yang diperlukan. Nilai secret tidak ada di backup.
          11. Jalankan workflow build dan cocokkan MAIN_COMMIT/checksum.
          EOT

          cat > "$APP/RECOVERY/VERIFY_BACKUP.ps1" <<'POWERSHELL'
          $ErrorActionPreference = "Stop"
          $AppRoot = Split-Path -Parent $PSScriptRoot
          $Bundle = Join-Path $AppRoot "GIT\AI-Ngerti-Geopolitik-COMPLETE-GIT-HISTORY.bundle"
          $Source = Join-Path $AppRoot "SOURCE\AI-Ngerti-Geopolitik-SOURCE-main.zip"
          if (-not (Test-Path $Bundle)) { throw "Git Bundle missing" }
          if (-not (Test-Path $Source)) { throw "Source ZIP missing" }
          git bundle verify $Bundle
          if ($LASTEXITCODE -ne 0) { throw "Git Bundle verification failed" }
          Write-Host "Backup core files verified."
          POWERSHELL

          cat > "$APP/RECOVERY/RESTORE_TO_NEW_GITHUB.ps1" <<'POWERSHELL'
          param(
            [Parameter(Mandatory=$true)][string]$NewRepoUrl
          )
          $ErrorActionPreference = "Stop"
          $AppRoot = Split-Path -Parent $PSScriptRoot
          $Bundle = Join-Path $AppRoot "GIT\AI-Ngerti-Geopolitik-COMPLETE-GIT-HISTORY.bundle"
          $Dest = Join-Path (Get-Location) "AI-Ngerti-Geopolitik-restored"
          git clone $Bundle $Dest
          Set-Location $Dest
          git remote remove origin
          git remote add origin $NewRepoUrl
          Write-Host "Repo restored locally. Review it, then run:"
          Write-Host "git push -u origin --all"
          Write-Host "git push origin --tags"
          POWERSHELL

          (cd "$APP" && find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$APP/SHA256SUMS.txt"

          test -s "$APP/GIT/AI-Ngerti-Geopolitik-COMPLETE-GIT-HISTORY.bundle"
          test -s "$APP/SOURCE/AI-Ngerti-Geopolitik-SOURCE-main.zip"
          unzip -t "$APP/SOURCE/AI-Ngerti-Geopolitik-SOURCE-main.zip" >/dev/null
          grep -q "$TARGET_SHA" "$APP/MAIN_COMMIT.txt"

          cat > "$APP/STATUS_BACKUP.txt" <<EOT
          BACKUP_STATUS: BACKUP_COMPLETE_CORE
          GIT_BUNDLE: VERIFIED
          SOURCE_SNAPSHOT: VERIFIED
          MAIN_COMMIT: $TARGET_SHA
          BUILD: SEPARATE_CHECK_REQUIRED
          SECRETS: NOT_BACKED_UP
          EOT

          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/AI-Ngerti-Geopolitik-BACKUP-$BACKUP_STAMP.zip" "$(basename "$ROOT")")

      - name: Upload verified backup payload
        uses: actions/upload-artifact@v4
        with:
          name: AI-Ngerti-Geopolitik-BACKUP-2026-10-08_00-45_WIB
          path: AI-Ngerti-Geopolitik-BACKUP-2026-10-08_00-45_WIB.zip
          if-no-files-found: error
          retention-days: 7
