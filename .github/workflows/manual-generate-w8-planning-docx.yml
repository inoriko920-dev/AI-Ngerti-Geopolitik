name: Generate W8 Planning DOCX

on:
  push:
    branches: [main]
    paths:
      - "docs/planning/11_S11_W8_VALIDATION_RECOVERY_DIAGNOSTICS_HARDENING_CONTRACT_PLAN_2026-10-08.txt"
      - ".github/workflows/manual-generate-w8-planning-docx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check python-docx
      - name: Generate detailed DOCX from locked TXT
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.enum.section import WD_SECTION
          from docx.shared import Inches, Pt

          src = Path("docs/planning/11_S11_W8_VALIDATION_RECOVERY_DIAGNOSTICS_HARDENING_CONTRACT_PLAN_2026-10-08.txt")
          dst = src.with_suffix(".docx")
          lines = src.read_text(encoding="utf-8").splitlines()

          doc = Document()
          sec = doc.sections[0]
          sec.top_margin = Inches(0.6)
          sec.bottom_margin = Inches(0.6)
          sec.left_margin = Inches(0.75)
          sec.right_margin = Inches(0.75)

          styles = doc.styles
          styles["Normal"].font.name = "Aptos"
          styles["Normal"].font.size = Pt(10)
          styles["Title"].font.name = "Aptos Display"
          styles["Title"].font.size = Pt(24)
          styles["Heading 1"].font.name = "Aptos Display"
          styles["Heading 1"].font.size = Pt(16)
          styles["Heading 2"].font.name = "Aptos Display"
          styles["Heading 2"].font.size = Pt(13)

          title = doc.add_paragraph(style="Title")
          title.alignment = WD_ALIGN_PARAGRAPH.CENTER
          title.add_run(lines[0])
          sub = doc.add_paragraph()
          sub.alignment = WD_ALIGN_PARAGRAPH.CENTER
          sub.add_run(lines[1]).italic = True
          doc.add_paragraph(lines[2])

          i = 3
          while i < len(lines):
              line = lines[i].rstrip()
              nxt = lines[i + 1].rstrip() if i + 1 < len(lines) else ""
              if not line:
                  i += 1
                  continue
              if nxt and set(nxt) <= {"=", "-"} and len(nxt) >= 3:
                  level = 1 if "=" in nxt else 2
                  doc.add_heading(line, level=level)
                  i += 2
                  continue
              if line.startswith("- "):
                  doc.add_paragraph(line[2:], style="List Bullet")
              elif line[:3].isdigit() and ". " in line[:5]:
                  doc.add_paragraph(line)
              else:
                  doc.add_paragraph(line)
              i += 1

          for section in doc.sections:
              footer = section.footer.paragraphs[0]
              footer.alignment = WD_ALIGN_PARAGRAPH.CENTER
              footer.add_run("AI Ngerti Geopolitik • ASTRA W8 Planning • 2026-10-08")

          doc.save(dst)
          print(dst)
          PY
      - name: Commit generated DOCX
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/11_S11_W8_VALIDATION_RECOVERY_DIAGNOSTICS_HARDENING_CONTRACT_PLAN_2026-10-08.docx
          if git diff --cached --quiet; then
            echo "DOCX already current"
            exit 0
          fi
          git commit -m "docs: add W8 planning DOCX"
          git push
