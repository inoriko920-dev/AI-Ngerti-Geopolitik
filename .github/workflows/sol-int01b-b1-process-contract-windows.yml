name: SOL INT01B B1 Pure Bounded Process Contract Windows

on:
  push:
    branches: [feature/sol-int01b-b1-process-contract]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: "offscreen"

jobs:
  process-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --group quality --group test
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run --frozen python scripts/verify/verify_ui_reference_manifest.py --root .
      - run: uv run pytest tests/unit/test_sol_int01b_b1_process_contract.py -q
      - run: uv run pytest -q
      - name: Assert immutable contract cannot execute native processes or enable UI
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path=Path("src/ai_ngerti_geopolitik/application/native_process_contract.py")
          source=path.read_text(encoding="utf-8")
          for forbidden in ("import subprocess", "from subprocess", "import os", "import shutil",
                            "Popen(", "subprocess.run(", "os.system(", "QPushButton", "shell=True"):
              assert forbidden not in source, forbidden
          assert source.count("return False") >= 2
          assert "class NativeProcessPolicy" in source
          assert "class NativeProcessOutcome" in source
          print("PASS B1: pure immutable policy, safe typed outcome, no execution or GUI activation")
          '@ | python
