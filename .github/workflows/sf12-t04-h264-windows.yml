name: SF12 T04 H264 Baseline Real-Media Qualification

on:
  push:
    branches: [feature/sf12-t04-h264-baseline]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: "offscreen"

jobs:
  qualify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - name: Install external FFmpeg qualification toolchain
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Check actual installed encoders
        shell: pwsh
        run: |
          where.exe ffmpeg
          where.exe ffprobe
          ffmpeg -hide_banner -encoders | Select-String "libx264"
          ffmpeg -hide_banner -encoders | Select-String "aac"
      - run: uv sync --frozen --group quality --group test
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run --frozen python scripts/verify/verify_ui_reference_manifest.py --root .
      - run: uv run pytest tests/unit/test_sf12_t04_export_h264.py -q
      - run: uv run pytest -q
      - name: Generate independent synthetic video/audio fixture
        run: uv run python scripts/generate_step10_fixture.py --output artifacts/sf12-t04/input_fixture.mp4
      - name: Real H264+AAC export and unsafe-path negative checks
        run: uv run python scripts/qualification/sf12_t04_h264_real_media.py --fixture artifacts/sf12-t04/input_fixture.mp4 --evidence artifacts/sf12-t04/evidence
      - name: Independently inspect codec, dimensions, frame rate and audio
        shell: pwsh
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate -show_entries format=format_name,duration -of json artifacts/sf12-t04/evidence/h264_baseline.mp4
          Get-FileHash artifacts/sf12-t04/evidence/h264_baseline.mp4 -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: ANG-SF12-T04-H264-RealMedia
          path: |
            artifacts/sf12-t04/evidence/**
          if-no-files-found: error
          retention-days: 14
