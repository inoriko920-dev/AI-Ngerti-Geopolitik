name: S11 W5-005 Subtitle Animation Word Timing

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/run_step11_w5_005.py"
      - "scripts/verify/verify_step11_w5_005_evidence.py"
      - ".github/workflows/s11-wave5-005-animation.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  UV_VERSION: "0.12.21"

jobs:
  w5-005:
    name: Subtitle animation and word timing boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - name: Install FFmpeg qualification toolchain
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - run: uv lock --check
      - run: uv sync --frozen --group quality --group test --group package
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run pytest -q tests/unit/test_step11_w5_005_animation.py
      - run: uv run pytest -q
      - name: Generate owned W5-005 fixture
        run: >
          uv run python scripts/generate_step10_fixture.py
          --output artifacts/step11/w5-005/input-video.mp4
      - name: Run real W5-005 animation evidence
        run: >
          uv run python scripts/run_step11_w5_005.py
          --video artifacts/step11/w5-005/input-video.mp4
          --evidence artifacts/step11/w5-005/evidence
      - name: Verify W5-005 evidence
        run: >
          uv run python scripts/verify/verify_step11_w5_005_evidence.py
          --evidence artifacts/step11/w5-005/evidence
      - uses: actions/upload-artifact@v4
        with:
          name: ANG-S11-W5-005-Subtitle-Animation
          path: artifacts/step11/w5-005/evidence/**
          if-no-files-found: error
          retention-days: 14
