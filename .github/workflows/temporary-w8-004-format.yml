name: Temporary W8-004 Formatting
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-w8-004-format.yml"
permissions:
  contents: write
jobs:
  format:
    if: "${{ !contains(github.event.head_commit.message, 'style: format W8-004') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install exact pinned Ruff
        run: python -m pip install ruff==0.16.10
      - name: Format only owned W8-004 code
        run: |
          ruff check --fix src/ai_ngerti_geopolitik/application/relink_scan.py src/ai_ngerti_geopolitik/infrastructure/relink_scan.py src/ai_ngerti_geopolitik/presentation/asset_scan.py tests/unit/test_step11_w8_004_relink_scan.py tests/qt/test_step11_w8_004_asset_scan.py scripts/run_step11_w8_004.py scripts/verify/verify_step11_w8_004_evidence.py || true
          ruff format src/ai_ngerti_geopolitik/application/relink_scan.py src/ai_ngerti_geopolitik/infrastructure/relink_scan.py src/ai_ngerti_geopolitik/presentation/asset_scan.py tests/unit/test_step11_w8_004_relink_scan.py tests/qt/test_step11_w8_004_asset_scan.py scripts/run_step11_w8_004.py scripts/verify/verify_step11_w8_004_evidence.py
      - name: Commit formatted W8-004 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_ngerti_geopolitik/application/relink_scan.py src/ai_ngerti_geopolitik/infrastructure/relink_scan.py src/ai_ngerti_geopolitik/presentation/asset_scan.py tests/unit/test_step11_w8_004_relink_scan.py tests/qt/test_step11_w8_004_asset_scan.py scripts/run_step11_w8_004.py scripts/verify/verify_step11_w8_004_evidence.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format W8-004 scan implementation and tests"
            git push origin HEAD:main
          fi
