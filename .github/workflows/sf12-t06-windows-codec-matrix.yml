name: SF12 T06 Native Codec Resolution FPS Matrix

on:
  push:
    branches: [feature/sf12-t06-codec-profile-matrix]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: "offscreen"

jobs:
  matrix-qualification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --frozen --group quality --group test
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run --frozen python scripts/verify/verify_ui_reference_manifest.py --root .
      - run: uv run pytest tests/unit/test_sf12_t06_export_profiles.py -q
      - run: uv run pytest -q
      - name: Install qualification-only FFmpeg, no application binary bundle
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Check H264, HEVC and AAC encoders
        shell: pwsh
        run: |
          ffmpeg -hide_banner -encoders | Select-String "libx264"
          ffmpeg -hide_banner -encoders | Select-String "libx265"
          ffmpeg -hide_banner -encoders | Select-String "aac"
          ffprobe -version | Select-Object -First 1
      - name: Generate owned 1080p30 input
        run: uv run python scripts/generate_step10_fixture.py --output artifacts/sf12-t06/owned_video.mp4
      - name: Encode and independently validate every declared matrix cell
        run: uv run python scripts/qualification/sf12_t06_real_codec_matrix.py --fixture artifacts/sf12-t06/owned_video.mp4 --evidence artifacts/sf12-t06/evidence
      - name: Independently inspect H265 and UHD stream outputs
        shell: pwsh
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate,nb_frames -show_entries format=duration,format_name -of json artifacts/sf12-t06/evidence/h265_1080p30.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate,nb_frames -show_entries format=duration,format_name -of json artifacts/sf12-t06/evidence/h264_4k30.mp4
          Get-FileHash artifacts/sf12-t06/evidence/h264_4k30.mp4 -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: ANG-SF12-T06-CodecMatrix-RealMedia
          path: artifacts/sf12-t06/evidence/**
          if-no-files-found: error
          retention-days: 14
