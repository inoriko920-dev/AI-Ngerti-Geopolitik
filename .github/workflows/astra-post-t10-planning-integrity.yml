name: ASTRA Post-T10 Planning Document Integrity

on:
  push:
    branches: [planning/astra-sf12-post-t10-integration-adr-20261008]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: "offscreen"

jobs:
  document-and-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --group quality --group test
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/verify/verify_architecture.py --root .
      - run: uv run python scripts/verify/verify_source_of_truth.py --root .
      - run: uv run python scripts/verify/verify_no_secrets.py --root .
      - run: uv run --frozen python scripts/verify/verify_ui_reference_manifest.py --root .
      - run: uv run pytest -q
      - name: Install independent DOCX reader
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0
      - name: Verify actual Word DOCX opens and content parity with TXT mirror
        shell: pwsh
        run: |
          @'
          from docx import Document
          from pathlib import Path
          from zipfile import ZipFile
          base = Path("docs/planning/13_ASTRA_POST_T10_INTEGRATION_AND_NATIVE_LICENSE_PLAN_2026-10-08")
          docx = base.with_suffix(".docx")
          md = base.with_suffix(".md").read_text(encoding="utf-8")
          txt = base.with_suffix(".txt").read_text(encoding="utf-8")
          assert md == txt, "Planning text mirror changed"
          with ZipFile(docx) as z:
              assert z.testzip() is None, "Invalid ZIP member"
              assert "word/document.xml" in z.namelist()
              assert "word/styles.xml" in z.namelist()
          document = Document(str(docx))
          content = "\n".join(p.text for p in document.paragraphs)
          assert len(document.paragraphs) >= 70, "Incomplete Word plan"
          for needle in (
              "POST-T10", "INT-00", "INT-09", "D1", "D4",
              "FFmpeg", "libopenshot", "OWNER APPROVAL PENDING", "27",
          ):
              assert needle in content, f"Word plan missing {needle}"
          assert "OWNER" in md and "NO SOL CODING" in md
          print(f"PASS editable DOCX verified: {len(document.paragraphs)} paragraphs, {docx.stat().st_size} bytes, MD/TXT parity")
          '@ | python
