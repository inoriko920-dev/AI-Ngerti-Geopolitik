[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-ngerti-geopolitik"
version = "0.0.0"
description = "AI Ngerti Geopolitik desktop editor foundation"
readme = "README.md"
requires-python = ">=3.12.10,<3.13"
dependencies = [
  "PySide6==6.11.1",
]

[dependency-groups]
quality = [
  "ruff==0.16.10",
  "mypy==2.4.0",
  "import-linter==2.15",
  "detect-secrets==1.5.0",
  "pip-audit==2.10.1",
]
test = [
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
  "pytest-cov==7.1.0",
]
package = [
  "pyinstaller==6.22.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_ngerti_geopolitik"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ai_ngerti_geopolitik"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
